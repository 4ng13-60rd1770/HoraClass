spring.application.name=horaclass
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hcdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.jpa.hibernate.ddl-auto=update
spring.app.jwtSecret=${JWT_SECRET:TmJN8fgP7ArCl6Gpx5+iVInlUon0vLjs8JYE15LHiUM=}
spring.app.jwtExpirationMS=28800000

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@horaclass.unbosque.edu.co}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Reglas de programación académica (parametrizables vía API admin)
app.scheduling.grupo-cupo-base=40
app.scheduling.grupo-cupo-tolerancia-porcentaje=10
app.scheduling.grupo-cupo-minimo=10
app.scheduling.sesiones-semanales-min=1
app.scheduling.sesiones-semanales-max=4
app.scheduling.duracion-sesion-horas=2
app.scheduling.hora-inicio-semana=07:00
app.scheduling.hora-fin-semana=22:00
app.scheduling.hora-inicio-sabado=07:00
app.scheduling.hora-fin-sabado=13:00
app.scheduling.hora-inicio-almuerzo=12:00
app.scheduling.hora-fin-almuerzo=13:00
app.scheduling.carga-horas-tiempo-completo=20
app.scheduling.carga-horas-tres-cuartos=15
app.scheduling.carga-horas-medio-tiempo=10
app.scheduling.carga-horas-cuarto-tiempo=5

logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.co.edu.unbosque=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false