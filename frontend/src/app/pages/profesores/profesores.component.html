<app-topbar searchPlaceholder="Buscar Profesor" actionLabel="Nuevo Docente" actionVariant="default" (actionClick)="abrirModal()"></app-topbar>

<div class="profesores-page">
  <div class="profesores-page__header">
    <h1>Directorio de Profesores</h1>
    <p class="text-muted">Año Academico: 2026-1</p>
  </div>

  <app-teachers-grid
    [teachers]="teachers"
    (editClick)="abrirEditar($event)"
    (deleteClick)="eliminar($event)">
  </app-teachers-grid>
</div>

<!-- Modal Crear -->
@if (modalAbierto) {
  <div class="modal-backdrop" (click)="cerrarModal()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2>Crear Docente</h2>
        <button class="modal__close" (click)="cerrarModal()">&#x2715;</button>
      </div>
      <div class="modal__body">
        <div class="form-row">
          <div class="form-group">
            <label>Cédula *</label>
            <input type="number" [(ngModel)]="form.idProfesor" placeholder="Ej: 12345678" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Primer Nombre *</label>
            <input type="text" [(ngModel)]="form.primerNombre" placeholder="Juan" (blur)="sugerirUsername()" />
          </div>
          <div class="form-group">
            <label>Primer Apellido *</label>
            <input type="text" [(ngModel)]="form.primerApellido" placeholder="Pérez" (blur)="sugerirUsername()" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Username *</label>
            <input type="text" [(ngModel)]="form.username" placeholder="jperez" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Carrera</label>
            <select [(ngModel)]="form.carrera">
              <option value="">Seleccionar carrera</option>
              <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
              <option value="Derecho">Derecho</option>
              <option value="Arquitectura">Arquitectura</option>
              <option value="Administración de Empresas">Administración de Empresas</option>
              <option value="Medicina">Medicina</option>
              <option value="Psicología">Psicología</option>
              <option value="Biología">Biología</option>
            </select>
          </div>
          <div class="form-group">
            <label>Carga Horaria</label>
            <input type="number" [(ngModel)]="form.cargaHoras" placeholder="12" min="0" />
          </div>
        </div>
        <p class="modal__hint">La contraseña inicial será la cédula del docente.</p>
        @if (errorModal) { <p class="modal__error">{{ errorModal }}</p> }
      </div>
      <div class="modal__footer">
        <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
        <button class="btn-guardar" (click)="guardar()" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Crear Docente' }}
        </button>
      </div>
    </div>
  </div>
}

<!-- Modal Editar -->
@if (modalEditar) {
  <div class="modal-backdrop" (click)="cerrarEditar()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2>Editar Docente</h2>
        <button class="modal__close" (click)="cerrarEditar()">&#x2715;</button>
      </div>
      <div class="modal__body">
        <div class="form-row">
          <div class="form-group">
            <label>Carrera</label>
            <select [(ngModel)]="formEdit.carrera">
              <option value="">Seleccionar carrera</option>
              <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
              <option value="Derecho">Derecho</option>
              <option value="Arquitectura">Arquitectura</option>
              <option value="Administración de Empresas">Administración de Empresas</option>
              <option value="Medicina">Medicina</option>
              <option value="Psicología">Psicología</option>
              <option value="Biología">Biología</option>
            </select>
          </div>
          <div class="form-group">
            <label>Carga Horaria</label>
            <input type="number" [(ngModel)]="formEdit.cargaHoras" min="0" />
          </div>
        </div>
        @if (errorModal) { <p class="modal__error">{{ errorModal }}</p> }
      </div>
      <div class="modal__footer">
        <button class="btn-cancelar" (click)="cerrarEditar()">Cancelar</button>
        <button class="btn-guardar" (click)="guardarEdicion()" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </div>
  </div>
}
