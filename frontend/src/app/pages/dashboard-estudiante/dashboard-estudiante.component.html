<app-topbar searchPlaceholder="Buscar Materia, Docente, ID"></app-topbar>

<div class="dash-est">
  <div class="dash-est__header">
    <h1>Hola, <span class="accent">{{ nombreMostrar }}</span> 👋</h1>
    <p class="text-muted">
      @if (perfil) {
        ID: {{ perfil.idEstudiante }} · {{ perfil.carrera }} · Estado: {{ perfil.estado }}
      } @else {
        Cargando información...
      }
    </p>
  </div>

  <app-stats-row [stats]="stats"></app-stats-row>

  <app-today-schedule [entries]="schedule"></app-today-schedule>
</div>
