# Requiere secrets en el repo: SONAR_TOKEN, SONAR_HOST_URL (SonarCloud: https://sonarcloud.io).
# SonarCloud: añade en sonar-project.properties: sonar.organization=TU_ORG

name: SonarQube

on:
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar backend (binarios para análisis Java)
        run: mvn -f backend -B -DskipTests compile

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend (análisis TypeScript)
        working-directory: frontend
        run: npm ci

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
